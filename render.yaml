services:
  - type: web
    name: subash-portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health

  - type: web
    name: subash-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run render:build
    staticPublishPath: dist/subash-portfolio/browser
    envVars:
      - key: API_URL
        value: https://subash-portfolio-api.onrender.com