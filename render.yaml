services:
  - type: web
    name: subash-portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CONTACT_RECIPIENT
        value: subashgoud12345@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://subash-portfolio-444w.onrender.com

  - type: web
    name: subash-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run render:build
    staticPublishPath: dist/subash-portfolio/browser
    envVars:
      - key: API_URL
        value: https://subash-portfolio-api.onrender.com