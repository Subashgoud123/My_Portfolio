services:
  - type: web
    name: subash-portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://subash-portfolio-444w.onrender.com

  - type: web
    name: subash-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run render:build
    staticPublishPath: dist/subash-portfolio/browser
    envVars:
      - key: API_URL
        value: https://subash-portfolio-api.onrender.com