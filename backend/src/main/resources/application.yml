spring:
  application:
    name: subash-portfolio-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/subash_portfolio}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  contact-recipient: ${CONTACT_RECIPIENT:subashgoud12345@gmail.com}
