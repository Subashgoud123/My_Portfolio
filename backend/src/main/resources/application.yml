spring:
  application:
    name: subash-portfolio-api
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  contact-recipient: ${CONTACT_RECIPIENT:subashgoud12345@gmail.com}
